<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{
  --bg:#ffffff; --side:#f6f6f7; --line:#ececee; --text:#18181b; --muted:#71717a; --faint:#a1a1aa;
  --hover:#ececef; --active:#e7e7ea; --card:#fafafa; --accent:#d97757; --green:#16a34a;
  --add:#ecfdf3; --addt:#15803d; --del:#fef2f2; --delt:#b91c1c; --chip:#f4f4f5; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
body.dark{
  --bg:#141416; --side:#1b1b1e; --line:#2a2a2e; --text:#ececee; --muted:#a1a1aa; --faint:#6b6b73;
  --hover:#26262a; --active:#2c2c31; --card:#1c1c1f; --accent:#e08a6a; --green:#4ade80;
  --add:#11261a; --addt:#6ee7a0; --del:#2a1416; --delt:#fca5a5; --chip:#232327; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{font-family:"Inter","Noto Sans CJK SC",sans-serif;font-size:14px;color:var(--text);background:#d9dbe0;-webkit-font-smoothing:antialiased;padding:28px}
body.dark{background:#0a0a0b}
.win{width:100%;height:100%;border-radius:12px;overflow:hidden;display:flex;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.25);border:1px solid var(--line)}
.side{width:264px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px}
.lights{display:flex;gap:8px;padding:2px 6px 18px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.newbtn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--text);font-weight:500}
.newbtn:hover{background:var(--hover)}
.kbd{margin-left:auto;font-size:11px;color:var(--faint)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:18px 10px 6px;font-size:12px;color:var(--faint);font-weight:500}
.proj{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--text);font-weight:500}
.proj .chev{color:var(--faint);width:10px;font-size:10px}
.proj .cnt{margin-left:auto;font-size:12px;color:var(--faint);font-weight:400}
.sess{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 30px;border-radius:8px;color:var(--muted);font-size:13.5px}
.sess.on{background:var(--active);color:var(--text)}
.sess .t{margin-left:auto;font-size:12px;color:var(--faint)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.br{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--chip);color:var(--muted);font-family:"JetBrains Mono","DejaVu Sans Mono",monospace}
.foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 10px 2px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.foot .g{width:7px;height:7px;border-radius:50%;background:var(--green)}
.foot .ic{margin-left:auto;display:flex;gap:12px;color:var(--faint)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:52px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--line);gap:10px}
.top h1{font-size:14px;font-weight:600}
.top .path{font-size:12.5px;color:var(--faint)}
.top .r{margin-left:auto;display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--text);background:var(--bg)}
.pill .m{color:var(--faint)}
.chat{flex:1;overflow:hidden;padding:30px 0 0}
.col{width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.user{align-self:flex-end;max-width:520px;background:var(--chip);padding:11px 15px;border-radius:16px 16px 4px 16px;line-height:1.6}
.ai{line-height:1.75;color:var(--text)}
.ai p+p{margin-top:8px}
code{font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;font-size:12.5px;background:var(--chip);padding:1px 5px;border-radius:4px}
.tool{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.th{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px}
.th .k{font-weight:600}
.th .f{font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;font-size:12.5px;color:var(--muted)}
.th .s{margin-left:auto;font-size:12px;color:var(--faint);display:flex;gap:10px;align-items:center}
.plus{color:var(--addt)} .minus{color:var(--delt)}
.diff{border-top:1px solid var(--line);font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;font-size:12.5px;line-height:1.75;padding:6px 0;background:var(--bg)}
.diff div{padding:0 14px;white-space:pre;display:flex}
.diff .n{width:34px;color:var(--faint);text-align:right;padding-right:14px;user-select:none}
.diff .a{background:var(--add);color:var(--addt)}
.diff .d{background:var(--del);color:var(--delt)}
.ok{width:16px;height:16px;border-radius:50%;background:var(--green);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.think{font-size:13px;color:var(--faint);display:flex;align-items:center;gap:8px}
.comp{padding:14px 0 22px}
.box{width:760px;margin:0 auto;border:1px solid var(--line);border-radius:18px;background:var(--bg);box-shadow:var(--shadow);padding:14px 14px 10px}
.ph{color:var(--faint);padding:2px 4px 14px;font-size:14.5px}
.bar{display:flex;align-items:center;gap:6px}
.chip{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.chip.b{background:var(--chip)}
.send{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px}
.hint{text-align:center;font-size:11.5px;color:var(--faint);margin-top:10px}
svg{display:block}
</style><style>
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:13.5px}
.nav.on{background:var(--active);color:var(--text);font-weight:500}
.nav svg{opacity:.8}
.back{display:flex;align-items:center;gap:8px;padding:6px 10px 14px;color:var(--muted);font-size:13px}
.pg{flex:1;overflow:hidden;padding:44px 0}
.pc{width:680px;margin:0 auto}
.pc h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
.pc .sub{color:var(--muted);margin-top:6px;font-size:13.5px}
.grp{margin-top:28px}
.grp h3{font-size:12px;color:var(--faint);font-weight:500;margin-bottom:8px;padding-left:2px}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);min-height:58px}
.row:first-child{border-top:none}
.row .l{flex:1}
.row .l b{font-weight:500;display:block}
.row .l span{display:block;font-size:12.5px;color:var(--faint);margin-top:2px}
.sel{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--bg)}
.sel .m{color:var(--faint)}
.tog{width:36px;height:21px;border-radius:999px;background:var(--line);position:relative}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on{background:var(--text)} .tog.on::after{left:17px;background:var(--bg)}
.btn{padding:7px 13px;border-radius:8px;border:1px solid var(--line);font-size:13px;background:var(--bg)}
.btn.p{background:var(--text);color:var(--bg);border-color:var(--text)}
.st{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.st i{width:7px;height:7px;border-radius:50%;background:var(--green);display:block}
.st.w i{background:#e5a50a}
.mono{font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;font-size:12.5px}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:2px}
.seg span{padding:5px 11px;border-radius:6px;font-size:12.5px;color:var(--muted)}
.seg span.on{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
</style></head><body class="light"><div class="win">
