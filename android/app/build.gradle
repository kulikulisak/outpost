plugins { id 'com.android.application' }

def ver = (System.getenv('OUTPOST_VERSION') ?: '0.7.0').replaceFirst('^v', '')
def parts = ver.tokenize('.').collect { it.replaceAll('[^0-9]', '') ?: '0' }

android {
    namespace 'app.outpost.android'
    compileSdk 34
    defaultConfig {
        applicationId 'app.outpost.android'
        minSdk 29
        targetSdk 34
        versionCode parts[0].toInteger() * 10000 + parts[1].toInteger() * 100 + parts[2].toInteger()
        versionName ver
    }
    signingConfigs {
        release {
            // a fixed key so updates install over the previous version; set OUTPOST_KEYSTORE to use your own
            def ks = System.getenv('OUTPOST_KEYSTORE') ?: rootProject.file('outpost-sideload.jks').path
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('OUTPOST_KEYSTORE_PASSWORD') ?: 'outpost-sideload'
                keyAlias System.getenv('OUTPOST_KEY_ALIAS') ?: 'outpost'
                keyPassword System.getenv('OUTPOST_KEYSTORE_PASSWORD') ?: 'outpost-sideload'
            } else {
                // no release key configured: fall back to the debug key so the APK still installs
                storeFile signingConfigs.debug.storeFile
                storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android'
            }
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
