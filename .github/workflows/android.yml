name: android
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: build apk
        working-directory: android
        run: |
          V="${GITHUB_REF_NAME#v}"; case "$V" in [0-9]*) ;; *) V=0.7.0 ;; esac
          OUTPOST_VERSION="$V" gradle --no-daemon assembleRelease
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/Outpost-$V-android.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: android/out/*.apk }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/out/*.apk
