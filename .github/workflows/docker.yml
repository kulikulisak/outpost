name: docker
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 3 * * 1'   # weekly: pick up the newest Claude Code
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
      - name: build (for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: outpost:test
      - name: smoke test
        run: |
          docker run -d --name outpost-test -e OUTPOST_PAIR_CODE=smoke-test-pass outpost:test
          for i in $(seq 1 30); do docker exec outpost-test curl -fsS http://127.0.0.1:8080/api/ping && break; sleep 1; done
          docker exec outpost-test rcc doctor
          docker exec outpost-test sh -c 'node -e "const r=JSON.parse(require(\"child_process\").execSync(\"rcc doctor\"));for(const k of [\"tmux\",\"git\",\"claude\",\"chromium\"])if(!r[k])throw new Error(k);if(!r.xvnc||!r.websockify||!r.windowManager)throw new Error(\"desk\")"'
          TOKEN=$(docker exec outpost-test curl -fsS -X POST -H 'Content-Type: application/json' -d '{"code":"smoke-test-pass","name":"ci"}' http://127.0.0.1:8080/api/pair | jq -r .token)
          docker exec outpost-test curl -fsS -H "Authorization: Bearer $TOKEN" -X POST -H 'Content-Type: application/json' -d '{"argv":["projects"]}' http://127.0.0.1:8080/api/rcc
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV
          docker logs outpost-test
      - name: smoke test (VPS browser)
        continue-on-error: true
        run: |
          docker exec outpost-test curl -fsS -H "Authorization: Bearer $TOKEN" -X POST -H 'Content-Type: application/json' -d '{"argv":["desk","--account","default"]}' http://127.0.0.1:8080/api/rcc
          sleep 4
          docker exec outpost-test curl -fsS "http://127.0.0.1:8080/cdp/$TOKEN/default/json/version"
          docker exec outpost-test sh -c 'tail -n 30 /root/.rcc/desktop-*.log 2>/dev/null || true'
      - name: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: push (with Chinese fonts)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: WITH_CJK_FONTS=1
          tags: ghcr.io/${{ github.repository }}:cjk
